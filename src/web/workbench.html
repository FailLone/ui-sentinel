<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Sentinel - Workbench</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; }
.container { max-width: 1200px; margin: 0 auto; padding: 16px; }
header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
header h1 { font-size: 1.2rem; color: #58a6ff; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.status-dot.ok { background: #3fb950; }
.status-dot.warn { background: #d29922; }
.status-dot.err { background: #f85149; }

.panel { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-top: 16px; }
.panel h2 { font-size: 1rem; margin-bottom: 12px; color: #8b949e; }

.form-row { display: flex; gap: 12px; align-items: flex-end; }
.form-group { flex: 1; }
.form-group label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 4px; }
.form-group input, .form-group select { width: 100%; padding: 8px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; font-size: 0.9rem; }

.btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
.btn-blue { background: #238636; color: white; }
.btn-blue:hover { background: #2ea043; }
.btn-blue:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-red { background: #da3633; color: white; }
.btn-red:hover { background: #f85149; }

.event-list { max-height: 500px; overflow-y: auto; font-family: 'SF Mono', monospace; font-size: 0.8rem; }
.event-item { padding: 6px 8px; border-bottom: 1px solid #21262d; display: flex; gap: 12px; }
.event-item:hover { background: #1c2128; }
.event-time { color: #484f58; min-width: 80px; }
.event-type { color: #58a6ff; min-width: 160px; }
.event-payload { color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.run-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.run-info .metric { text-align: center; }
.run-info .metric .value { font-size: 1.5rem; font-weight: 700; color: #58a6ff; }
.run-info .metric .label { font-size: 0.75rem; color: #484f58; }

.findings-list { margin-top: 12px; }
.finding-card { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 12px; margin-bottom: 8px; }
.finding-card .severity { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
.finding-card .severity.error { background: #3d1519; color: #f85149; }
.finding-card .severity.warning { background: #3d2e00; color: #d29922; }
.finding-card .severity.info { background: #0c2d6b; color: #58a6ff; }
</style>
</head>
<body>
<header>
  <h1>UI Sentinel</h1>
  <span id="server-status"><span class="status-dot"></span>Connecting...</span>
</header>

<div class="container">
  <div class="panel">
    <h2>Create Run</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Goal</label>
        <input type="text" id="goal" value="Complete a purchase in the TechMart store" />
      </div>
      <div class="form-group" style="max-width: 200px">
        <label>Entry URL</label>
        <input type="text" id="entry-url" value="http://localhost:4173" />
      </div>
      <button class="btn btn-blue" id="start-btn" onclick="startRun()">Start Run</button>
    </div>
  </div>

  <div class="panel" id="run-panel" style="display:none">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Run: <span id="run-id"></span></h2>
      <div>
        <span id="run-status" style="margin-right: 12px;"></span>
        <button class="btn btn-red" id="cancel-btn" onclick="cancelRun()" style="display:none">Cancel</button>
      </div>
    </div>
    <div class="run-info" id="run-metrics" style="margin-top: 12px;"></div>
  </div>

  <div class="panel" id="events-panel" style="display:none">
    <h2>Events <span id="event-count" style="color: #484f58; font-weight: 400;"></span></h2>
    <div class="event-list" id="event-list"></div>
  </div>

  <div class="panel" id="findings-panel" style="display:none">
    <h2>Findings</h2>
    <div class="findings-list" id="findings-list"></div>
  </div>
</div>

<script>
let currentRunId = null;
let eventSource = null;

async function checkHealth() {
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    const el = document.getElementById('server-status');
    if (data.status === 'ok') {
      el.innerHTML = '<span class="status-dot ok"></span>Connected';
    } else {
      el.innerHTML = '<span class="status-dot warn"></span>Degraded';
    }
    document.getElementById('start-btn').disabled = !data.model.ready;
    if (!data.model.ready) {
      document.getElementById('start-btn').title = 'Model not configured: ' + data.model.missing.join(', ');
    }
  } catch {
    document.getElementById('server-status').innerHTML = '<span class="status-dot err"></span>Disconnected';
  }
}

async function startRun() {
  const goal = document.getElementById('goal').value;
  const entryUrl = document.getElementById('entry-url').value;
  if (!goal) return;

  document.getElementById('start-btn').disabled = true;

  try {
    const res = await fetch('/api/runs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ goal, entryUrl }),
    });
    const data = await res.json();

    if (data.error) {
      alert('Error: ' + (data.message || data.error));
      document.getElementById('start-btn').disabled = false;
      return;
    }

    currentRunId = data.runId;
    document.getElementById('run-id').textContent = data.runId;
    document.getElementById('run-status').textContent = 'Status: ' + data.status;
    document.getElementById('run-panel').style.display = 'block';
    document.getElementById('events-panel').style.display = 'block';
    document.getElementById('cancel-btn').style.display = 'inline-block';
    document.getElementById('event-list').innerHTML = '';

    subscribeEvents(data.runId);
    pollStatus(data.runId);
  } catch (err) {
    alert('Failed to start run: ' + err.message);
    document.getElementById('start-btn').disabled = false;
  }
}

function subscribeEvents(runId) {
  if (eventSource) eventSource.close();

  eventSource = new EventSource('/api/runs/' + runId + '/events');

  eventSource.onmessage = function(e) {
    addEventItem(JSON.parse(e.data));
  };

  eventSource.addEventListener('done', function() {
    eventSource.close();
    eventSource = null;
    onRunComplete(runId);
  });

  const eventTypes = ['run:started', 'run:completed', 'run:error', 'run:cancelled',
    'browser:launched', 'navigation:completed', 'screenshot:captured',
    'agent:thinking', 'agent:response', 'agent:done', 'agent:blocked', 'agent:error',
    'action:executing', 'action:completed', 'action:failed',
    'exploration:state-reached', 'budget:timeout', 'budget:actions-exhausted'];

  eventTypes.forEach(type => {
    eventSource.addEventListener(type, function(e) {
      addEventItem(JSON.parse(e.data));
      if (type === 'run:completed' || type === 'run:error' || type === 'run:cancelled') {
        onRunComplete(runId);
      }
    });
  });

  eventSource.onerror = function() {
    setTimeout(() => {
      if (currentRunId === runId) pollStatus(runId);
    }, 2000);
  };
}

function addEventItem(event) {
  const list = document.getElementById('event-list');
  const item = document.createElement('div');
  item.className = 'event-item';
  const time = new Date(event.timestamp).toLocaleTimeString();
  const payload = JSON.stringify(event.payload).slice(0, 200);
  item.innerHTML = '<span class="event-time">' + time + '</span>' +
    '<span class="event-type">' + event.type + '</span>' +
    '<span class="event-payload">' + payload + '</span>';
  list.appendChild(item);
  list.scrollTop = list.scrollHeight;
  document.getElementById('event-count').textContent = '(' + list.children.length + ')';
}

async function pollStatus(runId) {
  try {
    const res = await fetch('/api/runs/' + runId);
    const data = await res.json();
    document.getElementById('run-status').textContent = 'Status: ' + data.status;
    updateMetrics(data);

    if (data.active) {
      setTimeout(() => pollStatus(runId), 3000);
    } else {
      onRunComplete(runId);
    }
  } catch { /* retry */ }
}

function updateMetrics(run) {
  const el = document.getElementById('run-metrics');
  el.innerHTML =
    metric('Actions', run.usage?.actions ?? 0) +
    metric('Model Calls', run.usage?.modelCalls ?? 0) +
    metric('Elapsed', ((run.usage?.elapsedMs ?? 0) / 1000).toFixed(1) + 's') +
    metric('Business', run.businessResult || 'unknown') +
    metric('Status', run.status);
}

function metric(label, value) {
  return '<div class="metric"><div class="value">' + value + '</div><div class="label">' + label + '</div></div>';
}

async function onRunComplete(runId) {
  document.getElementById('cancel-btn').style.display = 'none';
  document.getElementById('start-btn').disabled = false;

  try {
    const res = await fetch('/api/runs/' + runId + '/report');
    const report = await res.json();
    updateMetrics(report);

    if (report.findings && report.findings.length > 0) {
      document.getElementById('findings-panel').style.display = 'block';
      const list = document.getElementById('findings-list');
      list.innerHTML = '';
      report.findings.forEach(f => {
        const card = document.createElement('div');
        card.className = 'finding-card';
        card.innerHTML = '<span class="severity ' + f.severity + '">' + f.severity + '</span> ' +
          '<strong>' + f.title + '</strong>' +
          '<div style="margin-top:4px;color:#8b949e;font-size:0.85rem">' +
          'Expected: ' + f.expected + ' | Actual: ' + f.actual + '</div>';
        list.appendChild(card);
      });
    }
  } catch { /* report unavailable */ }
}

async function cancelRun() {
  if (!currentRunId) return;
  await fetch('/api/runs/' + currentRunId + '/cancel', { method: 'POST' });
}

checkHealth();
setInterval(checkHealth, 30000);
</script>
</body>
</html>
